<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Assessment Tools • Active Learning</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Active Learning</a>
      <nav class="nav">
        <a href="strategies.html">Strategies</a>
        <a href="case-studies.html">Case Studies</a>
        <a href="resources.html">Resources</a>
        <a href="assessment.html" aria-current="page">Assessment</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <h1>Assessment Tools</h1>
      <p class="muted">Formative checks, rubrics, and templates for evidence of learning.</p>

      <div class="cards three" id="tools"></div>
    </div>
  </main>

  <script src="assets/js/data.js" defer></script>
  <script defer>
    function createToolCard(t){
      const div = document.createElement('div');
      div.className = 'card';
      div.innerHTML = `<h4>${t.title}</h4><p>${t.summary}</p><div class="meta">${t.type}</div>`;
      const a = document.createElement('a'); a.href = t.href; a.textContent = 'Download'; a.className = 'btn secondary';
      div.appendChild(document.createElement('div')).appendChild(a);
      return div;
    }
    window.addEventListener('DOMContentLoaded', () => {
      const list = document.getElementById('tools');
      TOOLS.forEach(t => list.appendChild(createToolCard(t)));
    });
  </script>
</body>
</html>
