<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Strategy Details • Active Learning</title>
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="logo" href="index.html">Active Learning</a>
      <nav class="nav">
        <a href="strategies.html">Strategies</a>
        <a href="case-studies.html">Case Studies</a>
        <a href="resources.html">Resources</a>
        <a href="assessment.html">Assessment</a>
        <a href="about.html">About</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="container" id="content">
      <p class="muted">Loading…</p>
    </div>
  </main>

  <script src="assets/js/data.js" defer></script>
  <script defer>
    function getParam(name){
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }
    function renderStrategy(strategy){
      const container = document.getElementById('content');
      const details = strategy.details || { overview: '', steps: [], tips: [] };
      container.innerHTML = `
        <h1>${strategy.title}</h1>
        <p class="text-muted">${strategy.time} • ${strategy.classSize} • ${strategy.tags.join(', ')}</p>
        <p>${details.overview}</p>
        <div class="grid two">
          <section>
            <h3>Steps</h3>
            <ol>
              ${details.steps.map(s => `<li>${s}</li>`).join('')}
            </ol>
          </section>
          <section>
            <h3>Tips</h3>
            <ul class="checklist">
              ${details.tips.map(t => `<li>${t}</li>`).join('')}
            </ul>
          </section>
        </div>
        <div style="margin-top:16px">
          <a class="btn secondary" href="strategies.html">← Back to strategies</a>
        </div>
      `;
      document.title = `${strategy.title} • Active Learning`;
    }
    window.addEventListener('DOMContentLoaded', () => {
      const id = getParam('id');
      const strategy = (STRATEGIES || []).find(s => s.id === id);
      if (!strategy) {
        document.getElementById('content').innerHTML = '<p>Strategy not found.</p>';
        return;
      }
      renderStrategy(strategy);
    });
  </script>
</body>
</html>
